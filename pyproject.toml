[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmeval"
version = "0.1.0"
description = "Sizing, failure diagnosis and reproducible benchmarking for LLM inference deployments"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]

[project.scripts]
llmeval = "llmeval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
